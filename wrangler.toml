name              = "pisni"
main              = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding   = "ASSETS"
# Тільки API і room маршрути йдуть через worker
# Всі інші (jpg, mp3, json, html) роздаються напряму з assets
run_worker_first = ["/api/*", "/room/*", "/create"]

[build]
command = "node build-index.js"

[durable_objects]
bindings = [
  { name = "KARAOKE_ROOM", class_name = "KaraokeRoom" }
]

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["KaraokeRoom"]
