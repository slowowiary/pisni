name              = "pisni"
main              = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding   = "ASSETS"

[durable_objects]
bindings = [
  { name = "KARAOKE_ROOM", class_name = "KaraokeRoom" }
]

[[migrations]]
tag         = "v1"
new_sqlite_classes = ["KaraokeRoom"]
