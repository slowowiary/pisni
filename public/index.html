<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <style>
    /* hidden attribute must win over any display rule below */
    [hidden] { display: none !important; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      letter-spacing: 0.25em;
      color: #ff4081;
      text-transform: uppercase;
    }

    p.sub {
      color: #666;
      font-size: 0.95rem;
      margin-top: -0.5rem;
    }

    button {
      background: #ff4081;
      color: #fff;
      border: none;
      padding: 0.8rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover   { background: #e0305e; transform: translateY(-1px); }
    button:active  { transform: translateY(0); }
    button:disabled { background: #444; cursor: not-allowed; transform: none; }

    /* ── Home view ─────────────────────────────────────────── */
    #home-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* ── Room view ─────────────────────────────────────────── */
    #room-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 820px;
    }

    #room-url {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      color: #7ab4ff;
      word-break: break-all;
      cursor: pointer;
      transition: border-color 0.15s;
      width: 100%;
      text-align: center;
    }
    #room-url:hover { border-color: #7ab4ff; }

    #room-url-label {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: -0.5rem;
    }

    #status {
      font-size: 0.9rem;
      color: #777;
      min-height: 1.3em;
      text-align: center;
    }

    #play-btn {
      font-size: 1.3rem;
      padding: 1rem 4rem;
      letter-spacing: 0.1em;
    }

    /* ── Lyrics ─────────────────────────────────────────────── */
    #lyrics {
      margin-top: 1.5rem;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      line-height: 2.2;
      text-align: center;
      max-width: 720px;
    }

    .word {
      display: inline-block;
      color: #3a3a3a;
      transition: color 0.08s, transform 0.08s;
    }

    .word.done   { color: #666; }

    .word.active {
      color: #ff4081;
      transform: scale(1.18);
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
    }
    #sync-audio-label {
      font-size: 0.9rem;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #sync-audio-label input { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: #ff4081; }
  </style>
</head>
<body>

  <!-- ── Home ─────────────────────────────────────────────── -->
  <div id="home-view" hidden>
    <h1>Karaoke</h1>
    <p class="sub">Create a room and share the link with friends</p>
    <button id="create-btn">Create Room</button>
  </div>

  <!-- ── Room ─────────────────────────────────────────────── -->
  <div id="room-view" hidden>
    <h1>Karaoke</h1>

    <p id="room-url-label">Share this link with friends</p>
    <div id="room-url" title="Click to copy"></div>

    <div id="status"></div>

    <button id="play-btn" hidden>Play</button>
    <button id="pause-btn" hidden>Pause</button>

    <label id="sync-audio-label" hidden><input type="checkbox" id="sync-audio-check"> 🎵 Play music on all connected devices</label>

    <div id="lyrics"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
