<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke</title>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d; color: #eee;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; gap: 1rem;
    }

    h1 { font-size: clamp(2rem,8vw,4rem); letter-spacing:.25em; color:#ff4081; text-transform:uppercase; }
    p.sub { color:#666; font-size:.95rem; margin-top:-.5rem; }

    button {
      background:#ff4081; color:#fff; border:none;
      padding:.8rem 2.5rem; font-size:1.1rem; font-weight:600;
      border-radius:8px; cursor:pointer;
      transition:background .15s, transform .1s;
    }
    button:hover  { background:#e0305e; transform:translateY(-1px); }
    button:active { transform:translateY(0); }
    button:disabled { background:#444; cursor:not-allowed; transform:none; }
    #pause-btn { background:#555; }
    #pause-btn:hover { background:#444; }

    #home-view { display:flex; flex-direction:column; align-items:center; gap:1.5rem; }
    #room-view { display:flex; flex-direction:column; align-items:center; gap:1rem; width:100%; max-width:820px; }

    #room-url {
      background:#161616; border:1px solid #2a2a2a; border-radius:6px;
      padding:.55rem 1rem; font-size:.85rem; color:#7ab4ff;
      word-break:break-all; cursor:pointer; width:100%; text-align:center;
      transition:border-color .15s;
    }
    #room-url:hover { border-color:#7ab4ff; }
    #room-url-label { font-size:.75rem; color:#555; margin-bottom:-.5rem; }
    #status { font-size:.9rem; color:#777; min-height:1.3em; text-align:center; }

    .btn-row { display:flex; gap:1rem; align-items:center; justify-content:center; flex-wrap:wrap; }
    #play-btn  { font-size:1.3rem; padding:1rem 4rem; letter-spacing:.1em; }
    #pause-btn { font-size:1rem; padding:.8rem 2rem; }

    .audio-toggle {
      display:flex; align-items:center; gap:.6rem;
      font-size:.95rem; color:#aaa; cursor:pointer;
      padding:.6rem 1.2rem; border:1px solid #2a2a2a; border-radius:10px;
      transition:border-color .15s, color .15s, background .15s;
      user-select:none;
    }
    .audio-toggle:hover { border-color:#ff4081; color:#eee; background:#1a1a1a; }
    .audio-toggle input { width:1.15rem; height:1.15rem; cursor:pointer; accent-color:#ff4081; }

    /* Бейдж "Ready" */
    #ready-badge {
      background: #1a3a1a; border: 1px solid #2d7a2d;
      color: #4caf50; font-size: .85rem; padding: .35rem .9rem;
      border-radius: 20px; font-weight: 600;
    }

    #lyrics {
      margin-top:1.5rem; font-size:clamp(1.4rem,4vw,2.2rem);
      line-height:2.2; text-align:center; max-width:720px;
    }
    .word { display:inline-block; color:#3a3a3a; transition:color .08s, transform .08s; }
    .word.done   { color:#666; }
    .word.active { color:#ff4081; transform:scale(1.18); font-weight:700; text-shadow:0 0 20px rgba(255,64,129,.5); }
  </style>
</head>
<body>

  <div id="home-view" hidden>
    <h1>Karaoke</h1>
    <p class="sub">Create a room and share the link with friends</p>
    <button id="create-btn">Create Room</button>
  </div>

  <div id="room-view" hidden>
    <h1>Karaoke</h1>
    <p id="room-url-label">Share this link with friends</p>
    <div id="room-url" title="Click to copy"></div>
    <div id="status"></div>

    <div class="btn-row">
      <button id="play-btn"  hidden>Play</button>
      <button id="pause-btn" hidden>Pause</button>
    </div>

    <!-- Хост: увімкнути музику на всіх -->
    <label id="sync-audio-label" class="audio-toggle" hidden>
      <input type="checkbox" id="sync-audio-check">
      <span>🎵 Play music on all connected devices</span>
    </label>

    <!-- Учасник: особиста галочка (натиск = user gesture + завантаження буферу) -->
    <label id="my-audio-label" class="audio-toggle" hidden>
      <input type="checkbox" id="my-audio-check">
      <span>🔊 Play music on my device</span>
    </label>

    <!-- Показується після завантаження буферу -->
    <div id="ready-badge" hidden>✓ Audio ready</div>

    <div id="lyrics"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
