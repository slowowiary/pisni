<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    // SPA redirect trick for Cloudflare Pages / GitHub Pages:
    // A direct visit to /room/abc hits this 404.html instead of index.html.
    // We encode the full path into ?p= and bounce to the root, where
    // index.html reads it back and restores the URL via history.replaceState.
    var path = location.pathname + location.search;
    location.replace(location.origin + '/?p=' + encodeURIComponent(path));
  </script>
</head>
<body>Redirecting…</body>
</html>
