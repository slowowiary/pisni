<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages SPA trick:
    // When a user navigates directly to /room/abc, GitHub Pages serves this
    // 404.html instead.  We encode the path into ?p= and redirect to index.html,
    // which reads the param and restores the real URL via history.replaceState.
    var path = location.pathname + location.search;
    location.replace(location.origin + '/?p=' + encodeURIComponent(path));
  </script>
</head>
<body>Redirecting…</body>
</html>
